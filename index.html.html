<!doctype html>
<html lang="gu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>એડવાન્સ એડવોકેટ કેસ ડાયરી - Cloud Sync</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Firebase JS SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  
  <style>
    @media print {
      body { background-color: white !important; padding: 0 !important; }
      .no-print { display: none !important; }
      .print-area { box-shadow: none !important; border: none !important; padding: 0 !important; }
      .case-card { border: 1px solid #ccc !important; break-inside: avoid; margin-bottom: 12px !important; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-3 sm:p-6">
  <div class="max-w-4xl mx-auto">
    
    <!-- Header -->
    <header class="bg-indigo-800 text-white p-5 sm:p-6 rounded-2xl shadow-lg mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold">⚖️ મારી Advocate Case Diary</h1>
        <p class="text-indigo-200 text-sm sm:text-base mt-1">DEVRAM RABARI - Realtime Cloud Sync</p>
      </div>
      <div class="no-print flex flex-wrap gap-2">
        <button onclick="exportToCSV()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm px-3 py-2 rounded-lg font-medium transition flex items-center gap-1">
          📊 Excel (CSV)
        </button>
        <button onclick="window.print()" class="bg-slate-700 hover:bg-slate-800 text-white text-xs sm:text-sm px-3 py-2 rounded-lg font-medium transition flex items-center gap-1">
          🖨️ પ્રિન્ટ
        </button>
      </div>
    </header>

    <!-- Dashboard Stats Cards -->
    <div class="no-print grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center">
        <p class="text-xs sm:text-sm font-medium text-slate-500">કુલ કેસ</p>
        <p id="totalCasesCount" class="text-2xl sm:text-3xl font-bold text-indigo-700 mt-1">0</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center">
        <p class="text-xs sm:text-sm font-medium text-slate-500">આજની મુદત</p>
        <p id="todayCasesCount" class="text-2xl sm:text-3xl font-bold text-amber-600 mt-1">0</p>
      </div>
      <div class="col-span-2 sm:col-span-2 bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-2">
        <button onclick="filterTodayCases()" class="w-full sm:w-auto bg-amber-500 hover:bg-amber-600 text-white font-medium text-xs sm:text-sm px-4 py-2.5 rounded-lg transition">
          📅 આજનો બોર્ડ
        </button>
        <div class="w-full sm:w-auto flex items-center gap-1">
          <input type="date" id="filterDateInput" onchange="filterByDate()" class="border border-slate-300 rounded-lg px-2 py-1.5 text-xs">
          <button onclick="clearDateFilter()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs px-2 py-1.5 rounded-lg">રીસેટ</button>
        </div>
      </div>
    </div>

    <!-- Add / Edit Case Form -->
    <section class="no-print bg-white p-5 sm:p-6 rounded-2xl shadow-md mb-6 border border-slate-200">
      <h2 id="formTitle" class="text-xl font-semibold mb-4 text-indigo-700 flex items-center gap-2">
        <span>➕ નવો કેસ ઉમેરો</span>
      </h2>
      <form id="caseForm" class="space-y-4">
        <input type="hidden" id="editCaseId" value="">
        
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">કેસ નંબર / ટાઇટલ *</label>
            <input type="text" id="caseNumber" required placeholder="દા.ત. Civil Suit 12/2026" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">અસીલ (Client) નું નામ *</label>
            <input type="text" id="clientName" required placeholder="અસીલનું નામ" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">અસીલનો મોબાઈલ નંબર</label>
            <input type="tel" id="clientPhone" placeholder="10 અંકનો મોબાઈલ નંબર" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">કોર્ટનું નામ *</label>
            <input type="text" id="courtName" required placeholder="દા.ત. જિલ્લા કોર્ટ, અહમદાબાદ" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">આગામી મુદતની તારીખ *</label>
            <input type="date" id="hearingDate" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
        </div>
        
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">નોંધ / વિગત / સ્ટેજ</label>
          <textarea id="caseNote" rows="2" placeholder="કેસના સ્ટેજ અથવા અગત્યની નોંધ લખો..." class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
        </div>

        <div class="flex gap-2">
          <button type="submit" id="saveBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition text-sm">
            💾 કેસ સેવ કરો (Cloud Sync)
          </button>
          <button type="button" id="cancelBtn" onclick="resetForm()" class="hidden bg-slate-400 hover:bg-slate-500 text-white font-medium px-4 py-2.5 rounded-lg transition text-sm">
            રદ કરો
          </button>
        </div>
      </form>
    </section>

    <!-- Search & Filter Controls -->
    <div class="no-print bg-white p-4 rounded-xl shadow-sm mb-6 border border-slate-200 flex flex-col sm:flex-row gap-3 justify-between items-center">
      <div class="w-full sm:w-2/3 relative">
        <input type="text" id="searchInput" onkeyup="searchCases()" placeholder="🔍 સર્ચ કરો (કેસ નંબર, અસીલ, મોબાઈલ કે કોર્ટ)..." class="w-full border border-slate-300 rounded-lg pl-3 pr-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>
      <div class="flex gap-2 w-full sm:w-auto justify-end">
        <button onclick="renderCasesList(allCasesList)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs sm:text-sm px-3 py-2 rounded-lg font-medium border border-slate-300 transition">
          બધા કેસ
        </button>
      </div>
    </div>

    <!-- Cases List Section -->
    <section class="print-area bg-white p-5 sm:p-6 rounded-2xl shadow-md border border-slate-200">
      <div class="flex justify-between items-center mb-4">
        <h2 id="listHeading" class="text-xl font-semibold text-indigo-700">📋 તમારા કેસની યાદી</h2>
      </div>

      <div id="noCasesMsg" class="text-slate-500 text-center py-8 text-sm">હજુ સુધી કોઈ કેસ ઉમેરવામાં આવ્યો નથી.</div>
      <div id="casesList" class="space-y-4"></div>
    </section>

  </div>

  <script>
    // Firebase Configuration - Tamari firebase details ahiya muki do
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    let allCasesList = [];

    document.addEventListener('DOMContentLoaded', function() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('hearingDate').value = today;
      listenToFirebase();
    });

    // Realtime listener from Firebase Database
    function listenToFirebase() {
      db.ref('advocateCases').on('value', (snapshot) => {
        const data = snapshot.val();
        allCasesList = [];
        if (data) {
          Object.keys(data).forEach(key => {
            allCasesList.push({ id: key, ...data[key] });
          });
        }
        allCasesList.sort((a, b) => new Date(a.hearingDate) - new Date(b.hearingDate));
        renderCasesList(allCasesList);
      });
    }

    const caseForm = document.getElementById('caseForm');
    const casesList = document.getElementById('casesList');
    const noCasesMsg = document.getElementById('noCasesMsg');
    const formTitle = document.getElementById('formTitle');
    const saveBtn = document.getElementById('saveBtn');
    const cancelBtn = document.getElementById('cancelBtn');

    caseForm.addEventListener('submit', function(e) {
      e.preventDefault();

      const editId = document.getElementById('editCaseId').value;
      const caseData = {
        caseNumber: document.getElementById('caseNumber').value,
        clientName: document.getElementById('clientName').value,
        clientPhone: document.getElementById('clientPhone').value,
        courtName: document.getElementById('courtName').value,
        hearingDate: document.getElementById('hearingDate').value,
        caseNote: document.getElementById('caseNote').value
      };

      if (editId) {
        db.ref('advocateCases/' + editId).update(caseData, (error) => {
          if (!error) resetForm();
        });
      } else {
        const newRef = db.ref('advocateCases').push();
        newRef.set(caseData, (error) => {
          if (!error) resetForm();
        });
      }
    });

    function renderCasesList(listToDisplay) {
      updateStats(allCasesList);
      casesList.innerHTML = '';

      if (listToDisplay.length === 0) {
        noCasesMsg.style.display = 'block';
        return;
      } else {
        noCasesMsg.style.display = 'none';
      }

      const todayStr = new Date().toISOString().split('T')[0];

      listToDisplay.forEach(function(item) {
        const isToday = item.hearingDate === todayStr;
        const card = document.createElement('div');
        card.className = `case-card border p-4 rounded-xl bg-slate-50 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 transition ${isToday ? 'border-amber-400 bg-amber-50/50' : 'border-slate-200'}`;
        
        let whatsappBtn = '';
        if (item.clientPhone) {
          const cleanPhone = item.clientPhone.replace(/\D/g, '');
          const msg = encodeURIComponent(`Namaste ${item.clientName}, tamara case (${item.caseNumber}) ni aagami mudat tarikh ${item.hearingDate} chhe. - Adv. Devram Rabari`);
          whatsappBtn = `<a href="https://wa.me/91${cleanPhone}?text=${msg}" target="_blank" class="bg-emerald-100 hover:bg-emerald-200 text-emerald-700 text-xs font-semibold px-3 py-1.5 rounded-lg transition flex items-center gap-1">💬 WhatsApp</a>`;
        }

        card.innerHTML = `
          <div class="flex-1">
            <div class="flex items-center gap-2">
              <h3 class="font-bold text-lg text-indigo-950">${item.caseNumber}</h3>
              ${isToday ? '<span class="no-print bg-amber-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">આજે મુદત</span>' : ''}
            </div>
            <p class="text-sm text-slate-700 mt-1"><strong>અસીલ:</strong> ${item.clientName} ${item.clientPhone ? '(' + item.clientPhone + ')' : ''} | <strong>કોર્ટ:</strong> ${item.courtName}</p>
            <p class="text-sm ${isToday ? 'text-amber-700 font-bold' : 'text-red-600 font-medium'} mt-1"><strong>મુદત તારીખ:</strong> ${item.hearingDate}</p>
            ${item.caseNote ? `<p class="text-xs text-slate-600 mt-2 bg-white p-2.5 rounded-lg border border-slate-200"><strong>નોંધ:</strong> ${item.caseNote}</p>` : ''}
          </div>
          <div class="no-print flex flex-wrap items-center gap-2 self-end sm:self-center">
            ${whatsappBtn}
            <button onclick="editCase('${item.id}')" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 text-xs font-semibold px-3 py-1.5 rounded-lg transition">✏️ એડિટ</button>
            <button onclick="deleteCase('${item.id}')" class="bg-red-100 hover:bg-red-200 text-red-600 text-xs font-semibold px-3 py-1.5 rounded-lg transition">🗑️ ડિલીટ</button>
          </div>
        `;
        casesList.appendChild(card);
      });
    }

    function updateStats(cases) {
      const todayStr = new Date().toISOString().split('T')[0];
      const todayCount = cases.filter(c => c.hearingDate === todayStr).length;

      document.getElementById('totalCasesCount').innerText = cases.length;
      document.getElementById('todayCasesCount').innerText = todayCount;
    }

    function filterTodayCases() {
      const todayStr = new Date().toISOString().split('T')[0];
      const todayCases = allCasesList.filter(c => c.hearingDate === todayStr);
      document.getElementById('listHeading').innerText = "📅 આજની મુદતના કેસ";
      renderCasesList(todayCases);
    }

    function filterByDate() {
      const selectedDate = document.getElementById('filterDateInput').value;
      if (!selectedDate) return;
      const filtered = allCasesList.filter(c => c.hearingDate === selectedDate);
      document.getElementById('listHeading').innerText = `📅 તારીખ ${selectedDate} ના કેસ`;
      renderCasesList(filtered);
    }

    function clearDateFilter() {
      document.getElementById('filterDateInput').value = '';
      document.getElementById('listHeading').innerText = "📋 તમારા કેસની યાદી";
      renderCasesList(allCasesList);
    }

    function searchCases() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allCasesList.filter(c => 
        c.caseNumber.toLowerCase().includes(query) ||
        c.clientName.toLowerCase().includes(query) ||
        (c.clientPhone && c.clientPhone.toLowerCase().includes(query)) ||
        c.courtName.toLowerCase().includes(query) ||
        (c.caseNote && c.caseNote.toLowerCase().includes(query))
      );

      document.getElementById('listHeading').innerText = "🔍 સર્ચ પરિણામો";
      renderCasesList(filtered);
    }

    function editCase(id) {
      const item = allCasesList.find(c => c.id === id);
      if (item) {
        document.getElementById('editCaseId').value = item.id;
        document.getElementById('caseNumber').value = item.caseNumber;
        document.getElementById('clientName').value = item.clientName;
        document.getElementById('clientPhone').value = item.clientPhone || '';
        document.getElementById('courtName').value = item.courtName;
        document.getElementById('hearingDate').value = item.hearingDate;
        document.getElementById('caseNote').value = item.caseNote || '';

        formTitle.innerHTML = '<span>✏️ કેસમાં સુધારો (Edit) કરો</span>';
        saveBtn.innerText = '🔄 અપડેટ કરો';
        cancelBtn.classList.remove('hidden');

        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function resetForm() {
      caseForm.reset();
      document.getElementById('editCaseId').value = '';
      formTitle.innerHTML = '<span>➕ નવો કેસ ઉમેરો</span>';
      saveBtn.innerText = '💾 કેસ સેવ કરો (Cloud Sync)';
      cancelBtn.classList.add('hidden');
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('hearingDate').value = today;
      document.getElementById('listHeading').innerText = "📋 તમારા કેસની યાદી";
    }

    function deleteCase(id) {
      if (confirm('શું તમે ખરેખર આ કેસ ડિલીટ કરવા માંગો છો?')) {
        db.ref('advocateCases/' + id).remove();
      }
    }

    function exportToCSV() {
      if (allCasesList.length === 0) {
        alert('ડાઉનલોડ કરવા માટે કોઈ કેસ ઉપલબ્ધ નથી!');
        return;
      }

      let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
      csvContent += "કેસ નંબર,અસીલનું નામ,મોબાઈલ નંબર,કોર્ટનું નામ,મુદત તારીખ,નોંધ\n";

      allCasesList.forEach(c => {
        const row = `"${c.caseNumber}","${c.clientName}","${c.clientPhone || ''}","${c.courtName}","${c.hearingDate}","${(c.caseNote || '').replace(/"/g, '""')}"`;
        csvContent += row + "\n";
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `Case_Diary_${new Date().toISOString().split('T')[0]}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
